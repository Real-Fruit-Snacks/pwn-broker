name: links

# Links in the README and the docs. Monthly, because the pages they point at move without
# this repo changing.
on:
  push:
    branches: [main]
    paths: ['**.md']
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429
            --exclude '^https://github\.com/Real-Fruit-Snacks/pwn-broker/(issues/new|security/advisories/new)'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

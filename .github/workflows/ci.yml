name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The whole suite on Linux. Windows skips 15 tests (symlinks, named pipes, file modes,
    # ownership, backslash file names, the installer); here they run. vim is installed because
    # the tests that drive a real vim skip themselves without it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q -W error

  test-root:
    # The app is used as root and as a normal user. Same suite, run as root with this
    # interpreter, so the root-only branches (privilege, ownership) are exercised.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests as root
        run: sudo -E env "PATH=$PATH" python -m pytest -q -W error -p no:cacheprovider

  recording:
    # record under the real pinned asciinema: a zsh and a bash session recorded through a
    # pseudo-terminal, their casts written as they record, and their text copies checked. The
    # asciinema is the one in the release-file job's file, installed with install.sh --from into
    # a temporary install folder; tests/test_record_real.py runs here and in the kali job, and
    # skips in the others.
    needs: release-file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: release-file
          path: ${{ runner.temp }}/release-file
      - name: Install the release file
        run: |
          release="$(ls "$RUNNER_TEMP"/release-file/pwn-broker-*-linux-x86_64.tar.gz)"
          work="$RUNNER_TEMP/installed"
          export PWN_BROKER_OPT="$work/opt"
          export HOME="$work/home"
          mkdir -p "$HOME"
          sh install.sh --from "$release"
          echo "PWN_BROKER_REAL_ASCIINEMA=$PWN_BROKER_OPT/app/bin/asciinema" >>"$GITHUB_ENV"
      - name: Real recordings
        run: |
          test -f "$PWN_BROKER_REAL_ASCIINEMA"
          python -m pytest -q -W error tests/test_record_real.py

  installer:
    # install.sh and kali-cycle.sh: syntax under sh and dash, and shellcheck. Then the
    # release-file job's file installed with install.sh --from into a temporary install folder
    # and home, twice, each time checked: the app's version, app/bin/python is the pinned Python
    # and resolves under python/, asciinema is the pinned version, record starts, and .zshrc holds
    # the PATH line once. Then the same file installed in debian:stable-slim with no network and
    # no python3, which shows that an install needs neither.
    needs: release-file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-file
          path: ${{ runner.temp }}/release-file
      - name: Syntax
        run: |
          for script in install.sh .github/scripts/kali-cycle.sh; do
            sh -n "$script"
            dash -n "$script"
          done
      - name: shellcheck
        run: shellcheck install.sh .github/scripts/kali-cycle.sh
      - name: Install the release file twice
        run: |
          (cd "$RUNNER_TEMP/release-file" && sha256sum -c SHA256SUMS.txt)
          release="$(ls "$RUNNER_TEMP"/release-file/pwn-broker-*-linux-x86_64.tar.gz)"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          python_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' release/pins.toml)"
          work="$(mktemp -d)"
          export PWN_BROKER_OPT="$work/opt"
          export HOME="$work/home"
          mkdir -p "$HOME"
          checks() {
            "$PWN_BROKER_OPT/bin/pwn-broker" --version | tee "$work/version.txt"
            grep -qF "$version" "$work/version.txt"
            "$PWN_BROKER_OPT/app/bin/python" -I -c 'import platform; print(platform.python_version())' | tee "$work/python-version.txt"
            grep -qxF "$python_version" "$work/python-version.txt"
            real="$(readlink -f "$PWN_BROKER_OPT/app/bin/python")"
            echo "$PWN_BROKER_OPT/app/bin/python resolves to $real"
            case "$real" in
              "$(readlink -f "$PWN_BROKER_OPT/python")"/*) ;;
              *) echo "fail  app/bin/python does not resolve under $PWN_BROKER_OPT/python/"; exit 1 ;;
            esac
            "$PWN_BROKER_OPT/app/bin/asciinema" --version | tee "$work/asciinema-version.txt"
            grep -qF "3.2.1" "$work/asciinema-version.txt"
            "$PWN_BROKER_OPT/bin/record" --help | tee "$work/record-help.txt"
            grep -qxF "usage: record [target]" "$work/record-help.txt"
            test "$(grep -c '# pwn-broker' "$HOME/.zshrc")" = 1
          }
          sh install.sh --from "$release"
          checks
          sh install.sh --from "$release"
          checks
      - name: Install with no Python and no network
        # debian:stable-slim has no python3, and --network none leaves the container only loopback
        run: |
          release="$(cd "$RUNNER_TEMP/release-file" && ls pwn-broker-*-linux-x86_64.tar.gz)"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          docker run --rm --network none \
            -v "$PWD/install.sh:/src/install.sh:ro" -v "$RUNNER_TEMP/release-file:/release:ro" \
            -e "RELEASE=/release/$release" -e "VERSION=$version" \
            debian:stable-slim sh -euc '
              echo "network interfaces: $(ls /sys/class/net | tr "\n" " ")"
              if [ "$(ls /sys/class/net)" != lo ]; then echo "fail  the container has a network"; exit 1; fi
              if command -v python3; then echo "fail  python3 is on PATH"; exit 1; fi
              echo "ok    no network and no python3"
              sh /src/install.sh --from "$RELEASE"
              /opt/pwn-broker/bin/pwn-broker --version | tee /tmp/version.txt
              grep -qF "$VERSION" /tmp/version.txt
              /opt/pwn-broker/app/bin/asciinema --version
            '

  release-file:
    # The release file built twice from this checkout with release/build.py, sharing one cache,
    # and the two compared byte for byte, with their SHA256SUMS.txt; then tar lists and unpacks
    # it and gzip accepts it. The build fetches only what the repository pins. The file from the
    # first build is uploaded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        # the build script imports the app
        run: python -m pip install -e .
      - name: Build twice
        run: |
          python release/build.py --out one
          python release/build.py --out two
      - name: Compare
        run: |
          file="$(cd one && ls pwn-broker-*-linux-x86_64.tar.gz)"
          cmp "one/$file" "two/$file"
          cmp one/SHA256SUMS.txt two/SHA256SUMS.txt
          (cd one && sha256sum -c SHA256SUMS.txt)
      - name: Look inside
        run: |
          file="$(cd one && ls pwn-broker-*-linux-x86_64.tar.gz)"
          sha256sum "one/$file"
          tar -tzvf "one/$file"
          gzip -t "one/$file"
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked"
          tar -xzf "one/$file" -C "$unpacked"
          ls -lR "$unpacked"
      - name: Release file
        uses: actions/upload-artifact@v4
        with:
          name: release-file
          path: one/

  kali:
    # One whole box in the official Kali image, as root, with the real programs: the installer,
    # /etc/hosts, a ping, the pinned asciinema under Kali's zsh settings, OpenVPN bringing up
    # tun0, and the note window under a virtual display; the unit suite runs there too, on Kali's
    # own Python. Not a container job, because the tunnel module is loaded on the host first.
    # The container is started detached and kali-cycle.sh runs in it three times: prepare does
    # everything that needs the network; then the container is taken off its only network, and
    # install shows that nothing resolves or answers before it installs the release-file job's
    # file with install.sh --from and checks that the app runs on its bundled Python; then the
    # network is connected again and cycle runs the unit suite and the box, the box on the app's
    # bundled Python. So every push shows that an install reaches nothing. --init gives the
    # container a PID 1 that reaps orphaned processes, as a real system's does, so a stopped
    # daemon does not linger as a zombie. prepare downloads the pinned upstream Python build for
    # the test runtime package and checks its size and SHA-256; a Python test tool is installed
    # on it. The evidence folder is uploaded whatever the result.
    # The image is not pinned on purpose: the job is there to notice when Kali changes under the
    # app, as it did when Kali moved to Python 3.14.
    needs: release-file
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-file
          path: ${{ runner.temp }}/release-file
      - name: Tunnel module
        run: |
          sudo modprobe tun || echo "modprobe tun failed"
          if [ -e /dev/net/tun ]; then echo "/dev/net/tun exists"; else echo "/dev/net/tun is missing"; fi
      - name: Start Kali
        run: |
          mkdir -p "$RUNNER_TEMP/kali-evidence"
          docker run -d --init --name kali --hostname kali --cap-add NET_ADMIN --device /dev/net/tun \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/release-file:/release:ro" \
            -v "$RUNNER_TEMP/kali-evidence:/evidence" \
            kalilinux/kali-rolling sleep infinity
      - name: Prepare Kali, with the network on
        run: docker exec kali sh /src/.github/scripts/kali-cycle.sh prepare
      - name: Switch the network off
        # the container's only network is the default bridge; without it there is only loopback
        run: |
          docker network disconnect bridge kali
          networks="$(docker inspect --format '{{json .NetworkSettings.Networks}}' kali)"
          echo "$networks" | tee "$RUNNER_TEMP/kali-evidence/networks-off.txt"
          if [ "$networks" != "{}" ]; then
            echo "fail  the container is still on a network"
            exit 1
          fi
          echo "ok    the container is on no network"
      - name: Install the release file, with the network off
        # kali-cycle.sh install first shows that github.com does not resolve and 1.1.1.1:443 does not answer
        run: docker exec kali sh /src/.github/scripts/kali-cycle.sh install
      - name: Switch the network on
        run: |
          docker network connect bridge kali
          networks="$(docker inspect --format '{{json .NetworkSettings.Networks}}' kali)"
          echo "$networks" | tee "$RUNNER_TEMP/kali-evidence/networks-on.txt"
          if [ "$networks" = "{}" ]; then
            echo "fail  the container is on no network"
            exit 1
          fi
          echo "ok    the container is on the bridge again"
      - name: The cycle in Kali
        run: docker exec kali sh /src/.github/scripts/kali-cycle.sh cycle
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kali-evidence
          path: ${{ runner.temp }}/kali-evidence
      - name: Remove the container
        if: always()
        run: docker rm -f kali

  art:
    # The README panel is generated; fail if docs/assets/panel-*.svg no longer match docs/art/make-panel.py.
    name: README panel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Redraw the panel
        run: |
          python -m pip install --quiet -r docs/art/requirements.txt
          python docs/art/make-panel.py
          git diff --exit-code -- docs/assets/panel-dark.svg docs/assets/panel-light.svg

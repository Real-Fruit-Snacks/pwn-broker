name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The whole suite on Linux. Windows skips 15 tests (symlinks, named pipes, file modes,
    # ownership, backslash file names, the installer); here they run. vim is installed because
    # the tests that drive a real vim skip themselves without it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q -W error

  test-root:
    # The app is used as root and as a normal user. Same suite, run as root with this
    # interpreter, so the root-only branches (privilege, ownership) are exercised.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests as root
        run: sudo -E env "PATH=$PATH" python -m pytest -q -W error -p no:cacheprovider

  recording:
    # record under the real pinned asciinema: a zsh and a bash session recorded through a
    # pseudo-terminal, their casts written as they record, and their text copies checked.
    # Only this job fetches asciinema; tests/test_record_real.py skips everywhere else.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch the pinned asciinema
        run: |
          python -c '
          import os
          from pathlib import Path
          from pwn_broker import recorder
          from pwn_broker.paths import AppPaths
          root = Path(os.environ["RUNNER_TEMP"]) / "asciinema"
          paths = AppPaths(opt=root / "opt", home=root / "home")
          recorder.fetch(paths)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PWN_BROKER_REAL_ASCIINEMA={paths.asciinema}\n")
          print(paths.asciinema)
          '
      - name: Real recordings
        run: |
          test -f "$PWN_BROKER_REAL_ASCIINEMA"
          python -m pytest -q -W error tests/test_record_real.py
      - name: The installer's asciinema download
        # the installer job passes --no-asciinema; this is the one run of the installer's own download
        run: |
          work="$RUNNER_TEMP/installer"
          export PWN_BROKER_OPT="$work/opt"
          export HOME="$work/home"
          mkdir -p "$HOME"
          sh install.sh --from .
          test -x "$PWN_BROKER_OPT/app/bin/asciinema"
          "$PWN_BROKER_OPT/app/bin/asciinema" --version | tee "$work/asciinema-version.txt"
          grep -qF "3.2.1" "$work/asciinema-version.txt"
          "$PWN_BROKER_OPT/bin/record" --help | tee "$work/record-help.txt"
          grep -qxF "usage: record [target]" "$work/record-help.txt"

  installer:
    # install.sh: syntax under sh and dash, shellcheck, then a real install from this checkout
    # into a temporary install folder and home, run twice.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: |
          sh -n install.sh
          dash -n install.sh
      - name: shellcheck
        run: shellcheck install.sh
      - name: Install from the checkout
        run: |
          work="$(mktemp -d)"
          export PWN_BROKER_OPT="$work/opt"
          export HOME="$work/home"
          mkdir -p "$HOME"
          sh install.sh --from . --no-asciinema
          test -x "$PWN_BROKER_OPT/bin/pwn-broker"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          "$PWN_BROKER_OPT/bin/pwn-broker" --version | tee "$work/version.txt"
          grep -qF "$version" "$work/version.txt"
          sh install.sh --from . --no-asciinema
          test "$(grep -c '# pwn-broker' "$HOME/.zshrc")" = 1

  kali:
    # One whole box in the official Kali image, as root, with the real programs: the installer,
    # /etc/hosts, a ping, the pinned asciinema under Kali's zsh settings, OpenVPN bringing up
    # tun0, and the note window under a virtual display; the unit suite runs there too. Not a
    # container job, because the tunnel module is loaded on the host first. --init gives the
    # container a PID 1 that reaps orphaned processes, as a real system's does, so a stopped
    # daemon does not linger as a zombie. The evidence folder is uploaded whatever the result.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Tunnel module
        run: |
          sudo modprobe tun || echo "modprobe tun failed"
          if [ -e /dev/net/tun ]; then echo "/dev/net/tun exists"; else echo "/dev/net/tun is missing"; fi
      - name: The cycle in Kali
        run: |
          mkdir -p "$RUNNER_TEMP/kali-evidence"
          docker run --rm --init --hostname kali --cap-add NET_ADMIN --device /dev/net/tun \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/kali-evidence:/evidence" \
            kalilinux/kali-rolling sh /src/.github/scripts/kali-cycle.sh
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kali-evidence
          path: ${{ runner.temp }}/kali-evidence

  art:
    # The README panel is generated; fail if docs/assets/panel-*.svg no longer match docs/art/make-panel.py.
    name: README panel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Redraw the panel
        run: |
          python -m pip install --quiet -r docs/art/requirements.txt
          python docs/art/make-panel.py
          git diff --exit-code -- docs/assets/panel-dark.svg docs/assets/panel-light.svg

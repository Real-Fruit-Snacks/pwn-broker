name: release

# A vX.Y.Z tag: check it matches pyproject.toml, run the tests, build the wheel, and publish
# the release with notes from CHANGELOG.md, the wheel and SHA256SUMS.txt. install.sh downloads
# exactly those two files from releases/latest/download/.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag matches pyproject.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but pyproject.toml has version $have"
            exit 1
          fi
      - name: vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim
      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q -W error
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
          ls -l dist
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- *.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notes from CHANGELOG.md
        run: |
          # The section headed "## vX.Y.Z", with or without a "(unreleased)" suffix.
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## v$version" '
            on && /^## / { exit }
            $0 == h || index($0, h " ") == 1 { on = 1; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes under '## v$version'"
            exit 1
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest

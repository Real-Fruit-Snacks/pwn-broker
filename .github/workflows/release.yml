name: release

# A vX.Y.Z tag: check it matches pyproject.toml, build the release file with release/build.py,
# install it into a temporary install folder, run the unit suite on the Python it carries,
# and publish the release with notes from CHANGELOG.md and exactly three files:
#   pwn-broker-<version>-linux-x86_64.tar.gz   the release file
#   SHA256SUMS.txt                             its checksum
#   install.sh                                 the installer, from the checkout at the tag
# install.sh downloads the other two from releases/latest/download/.
#
# Run by hand (workflow_dispatch) it is a dry run: every step but the tag check and the
# publishing runs, with the version taken from pyproject.toml, and nothing is published.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag matches pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but pyproject.toml has version $have"
            exit 1
          fi
      - name: Version
        # pyproject.toml's version; on a tag it has just been checked against the tag
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test -n "$version"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "ok    version $version"
      - name: Install
        # the build script imports the app
        run: python -m pip install -e .
      - name: Build the release file
        run: python release/build.py --out "$RUNNER_TEMP/release-out"
      - name: Check the release file and its checksum
        working-directory: ${{ runner.temp }}/release-out
        run: |
          ls -l
          file="pwn-broker-$VERSION-linux-x86_64.tar.gz"
          test -f "$file"
          if [ "$(ls | wc -l)" != 2 ]; then
            echo "fail  the build wrote something other than the release file and SHA256SUMS.txt"
            exit 1
          fi
          cat SHA256SUMS.txt
          if [ "$(wc -l <SHA256SUMS.txt)" != 1 ]; then
            echo "fail  SHA256SUMS.txt does not name exactly one file"
            exit 1
          fi
          named="$(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS.txt)"
          if [ "$named" != "$file" ]; then
            echo "fail  SHA256SUMS.txt names $named, not $file"
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt
          echo "ok    $file matches SHA256SUMS.txt"
      - name: Install the release file
        run: |
          work="$RUNNER_TEMP/installed"
          export PWN_BROKER_OPT="$work/opt"
          export HOME="$work/home"
          mkdir -p "$HOME"
          sh install.sh --from "$RUNNER_TEMP/release-out/pwn-broker-$VERSION-linux-x86_64.tar.gz"
          echo "PWN_BROKER_OPT=$PWN_BROKER_OPT" >>"$GITHUB_ENV"
          echo "INSTALLED_HOME=$HOME" >>"$GITHUB_ENV"
      - name: The installed launcher
        run: |
          export HOME="$INSTALLED_HOME"
          "$PWN_BROKER_OPT/bin/pwn-broker" --version | tee "$RUNNER_TEMP/version.txt"
          grep -qF "$VERSION" "$RUNNER_TEMP/version.txt"
          echo "ok    pwn-broker --version holds $VERSION"
      - name: zsh and vim
        # the real recording tests need zsh, and some tests drive a real vim and skip without it
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh vim
      - name: Unit suite on the installed Python
        run: |
          python_bin="$PWN_BROKER_OPT/python/bin/python3"
          "$python_bin" --version
          test -f "$PWN_BROKER_OPT/app/bin/asciinema"
          "$python_bin" -m venv "$RUNNER_TEMP/suite-venv"
          "$RUNNER_TEMP/suite-venv/bin/python" --version
          "$RUNNER_TEMP/suite-venv/bin/python" -m pip install -e ".[dev]"
          export PWN_BROKER_REAL_ASCIINEMA="$PWN_BROKER_OPT/app/bin/asciinema"
          "$RUNNER_TEMP/suite-venv/bin/python" -m pytest -q -W error
      - name: Notes from CHANGELOG.md
        run: |
          # The section headed "## vX.Y.Z", with or without a "(unreleased)" suffix.
          awk -v h="## v$VERSION" '
            on && /^## / { exit }
            $0 == h || index($0, h " ") == 1 { on = 1; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes under '## v$VERSION'"
            exit 1
          fi
          cat notes.md
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/release-out"
          gh release create "$GITHUB_REF_NAME" \
            "$out/pwn-broker-$VERSION-linux-x86_64.tar.gz" "$out/SHA256SUMS.txt" install.sh \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
      - name: Dry run
        if: github.ref_type != 'tag'
        run: echo "ok    dry run: nothing was published"

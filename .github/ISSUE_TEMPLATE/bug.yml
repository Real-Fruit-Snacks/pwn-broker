name: Bug
description: pwn-broker or its docs don't do what the README says
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Kali, Python (`python3 --version`), pwn-broker (`pwn-broker --version`)
      placeholder: Kali 2025.4, Python 3.13.5, pwn-broker 0.1.10
    validations:
      required: true
  - type: dropdown
    id: user
    attributes:
      label: Run as
      options: [Root, Normal user, Both, Not sure]
    validations:
      required: true
  - type: textarea
    id: typed
    attributes:
      label: What I typed in the prompt
      description: The commands, in order, as typed
      render: text
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What it printed
      description: Remove real credentials, flags and addresses first. Placeholders are fine.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

name: Feature
description: Something it should do and doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do on a box, and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: A prompt command, a question, a line of status output. Optional.
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround

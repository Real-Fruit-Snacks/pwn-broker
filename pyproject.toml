[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwn-broker"
version = "0.1.0"
description = "Organise Hack The Box machines on Kali Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pwn-broker = "pwn_broker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pwn_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

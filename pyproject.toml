[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pwn-broker"
version = "0.1.7"
description = "Keeps a box's targets, notes, creds and tools in order"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Real-Fruit-Snacks" }]
keywords = ["hackthebox", "htb", "kali", "pentesting", "notes", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
    "tomli-w>=1.0",
    "pyte==0.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Real-Fruit-Snacks/pwn-broker"
Repository = "https://github.com/Real-Fruit-Snacks/pwn-broker"
Issues = "https://github.com/Real-Fruit-Snacks/pwn-broker/issues"
Changelog = "https://github.com/Real-Fruit-Snacks/pwn-broker/blob/main/CHANGELOG.md"

[project.scripts]
pwn-broker = "pwn_broker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pwn_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

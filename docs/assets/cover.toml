# Cover + social preview. Regenerate with Real-Fruit-Snacks/rfs-brand, from the folder holding both clones:
#   python3 rfs-brand/tools/make-cover.py pwn-broker/docs/assets/cover.toml
# Layout v2 (BRAND.md section 7): name, rule, the README one-liner, and one panel.
name        = "pwn-broker"
description = "Keeps a box's targets, notes, creds and tools in order"   # README line 1

# A short session. Every line is one the app prints or the user types: the
# shell command that starts it, the app's own status lines, and the commands
# typed at its "forest/dc01 > " prompt (shown as plain lines, since the cover
# types only its first command).
[panel]
kind  = "terminal"
lines = [
  "$ pwn-broker new",
  "ok target dc01 created",
  "ok box forest created",
  "forest/dc01 > cred add",
  "ok cred 1 saved, found on dc01",
  "forest/dc01 > finish",
]
